<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tugas 7 – Refleksi Technopreneurship</title>
<meta name="description" content="Versi interaktif refleksi Tugas 7 Technopreneurship: tujuh materi dan satu benang merah, oleh Yohanes Agung Prasetya Putra, S.T.">
<meta name="theme-color" content="#0B2A5B">
<meta property="og:type" content="website">
<meta property="og:title" content="Tugas 7 – Refleksi Technopreneurship">
<meta property="og:description" content="Tujuh materi Technopreneurship, satu benang merah. Refleksi interaktif.">
<meta property="og:locale" content="id_ID">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A5B;--sky:#4DA3FF;--bg:#F4F7FB;--card:#FFFFFF;--ink:#13233F;--muted:#5B6B83;--line:#D5DEEA;--accent:#1F6FEB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#091426;--card:#0F2040;--ink:#E7EEF9;--muted:#93A5C0;--line:#213658;--accent:#6CB0FF}}
:root[data-theme="dark"]{--bg:#091426;--card:#0F2040;--ink:#E7EEF9;--muted:#93A5C0;--line:#213658;--accent:#6CB0FF}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Barlow",system-ui,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:0;line-height:1.05}
.hero{background:var(--navy);color:#fff;padding:56px 20px 48px}
.in{max-width:1000px;margin:0 auto}
.hero h1{font-size:clamp(46px,10vw,96px);font-weight:700}
.hero .lead{font-size:clamp(18px,2.6vw,24px);max-width:34ch;margin:16px 0 28px;color:#CFE0F7}
.meta{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:15px;color:#CFE0F7;margin-bottom:32px}
.meta b{display:block;color:#fff;font-weight:600;font-size:17px}
.btn{display:inline-block;background:var(--sky);color:#06214A;font:600 17px "Barlow",Arial,sans-serif;padding:12px 24px;border-radius:999px;text-decoration:none;border:0;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hero :focus-visible{outline-color:#fff}
main{max-width:1000px;margin:0 auto;padding:48px 20px 40px}
.intro{max-width:60ch;margin-bottom:32px}
.intro h2{font-size:clamp(30px,5vw,44px);margin-bottom:8px}
.intro p{margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:32px;align-items:start}
.path{position:relative;display:flex;flex-direction:column;gap:4px;padding-left:34px}
.path::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;border-left:2px dashed var(--line)}
.plane{position:absolute;left:3px;top:6px;width:22px;height:22px;transition:transform .5s ease;font-size:20px;line-height:22px;color:var(--accent);transform:rotate(180deg);pointer-events:none}
.stop{position:relative;text-align:left;background:none;border:0;color:var(--muted);font:500 16px/1.3 "Barlow",Arial,sans-serif;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:44px}
.stop::before{content:attr(data-n);position:absolute;left:-34px;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--line);font-size:12px;line-height:18px;text-align:center;color:var(--muted)}
.stop:hover{background:var(--card)}
.stop[aria-selected="true"]{color:var(--ink);background:var(--card);font-weight:600}
.stop[aria-selected="true"]::before{border-color:var(--accent);background:var(--accent);color:#fff}
.stop.done::before{border-color:var(--accent);color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 28px 24px;min-height:430px}
.panel h3{font-size:clamp(30px,5vw,42px);margin-bottom:4px}
.theme{color:var(--accent);font-weight:600;margin:0 0 18px}
.panel ul{margin:0 0 22px;padding-left:20px}
.panel li{margin-bottom:8px}
blockquote{margin:0 0 24px;padding:4px 0 4px 18px;border-left:4px solid var(--sky);font-size:20px;line-height:1.45;font-style:italic}
.nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.nav button{background:none;border:1px solid var(--line);color:var(--ink);font:500 15px "Barlow",Arial,sans-serif;padding:9px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.nav button:disabled{opacity:.4;cursor:default}
.nav button:not(:disabled):hover{border-color:var(--accent)}
.thread{margin-top:56px;background:var(--navy);color:#fff;border-radius:14px;padding:36px 28px}
.thread h2{font-size:clamp(30px,5vw,46px);margin-bottom:12px}
.thread p{max-width:62ch;margin:0 0 14px;color:#D6E4F8}
.steps{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.steps span{border:1px solid #3B5B8F;border-radius:999px;padding:6px 14px;font-size:15px}
footer{max-width:1000px;margin:0 auto;padding:0 20px 48px;color:var(--muted);font-size:14px}
@media (max-width:760px){
.layout{grid-template-columns:1fr;gap:16px}
.path{flex-direction:row;overflow-x:auto;padding:4px 0 8px;gap:8px}
.path::before,.plane{display:none}
.stop{flex:0 0 auto;padding:8px 14px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.stop::before{display:none}
.stop[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{padding:22px 18px;min-height:0}
}
.panel p.full{margin:0 0 18px;line-height:1.75;text-align:justify;hyphens:auto}.panel p.full:last-of-type{margin-bottom:24px}
.mus{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 16px 10px 12px;font:600 15px "Barlow",system-ui,Arial,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(5,20,50,.35)}
.mus:hover{filter:brightness(1.12)}.mus svg{width:22px;height:22px;flex:none}
.mus .bars{display:none;gap:2px;align-items:flex-end;height:16px}.mus .bars i{width:3px;background:var(--sky);border-radius:2px;animation:eq 1s ease-in-out infinite}
.mus .bars i:nth-child(2){animation-delay:.25s}.mus .bars i:nth-child(3){animation-delay:.5s}
.mus[aria-pressed="true"] .bars{display:flex}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
@media (prefers-reduced-motion:reduce){.mus .bars i{animation:none;height:10px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.plane{transition:none}}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:40px}
.brand img{width:76px;height:76px;border-radius:50%;background:#fff;flex:none}
.brand strong{display:block;font:700 clamp(17px,3vw,22px)/1.2 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.3px;max-width:36ch}
.brand span{font-size:14px;color:#CFE0F7}
.fig{margin:0 0 22px;border-radius:10px;background:var(--bg);padding:14px;text-align:center}
.fig svg{width:100%;max-width:420px;height:auto;max-height:150px}
.fig .a{stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fig .f{fill:var(--accent)}.fig .l{fill:var(--line)}
.refl{margin:0 0 22px;color:var(--ink)}
.fig img{display:block;margin:0 auto;max-width:100%;max-height:340px;width:auto;height:auto;border-radius:8px}
.hero .in{display:grid;grid-template-columns:1fr auto;column-gap:48px;align-items:start}
.hero .in>*{grid-column:1}
.hero .in>.btn{justify-self:start}
.hero .in>.me{grid-column:2;grid-row:1/span 6;align-self:center;position:relative;width:clamp(190px,26vw,280px);aspect-ratio:1;margin:22px}
.me img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 14%;border-radius:50%;box-shadow:0 0 0 5px var(--sky);background:#d9dde3}
.me::before{content:"";position:absolute;inset:-22px;border:2px dashed rgba(77,163,255,.55);border-radius:50%;pointer-events:none}
.me::after{content:"✈";position:absolute;left:calc(50% + .707*(50% + 22px) - 14px);top:calc(50% - .707*(50% + 22px) - 16px);font-size:28px;line-height:1;color:var(--sky);transform:rotate(-45deg)}
@media (max-width:760px){.hero .in{display:block}.hero .in>.me{width:150px;margin:8px 0 34px 22px}}

.hero::after{
  content:"";
  position:absolute;
  z-index:-1;
  inset:0;
  background:linear-gradient(135deg,transparent 0 58%,rgba(255,255,255,.045) 58% 72%,transparent 72%),
             linear-gradient(0deg,rgba(4,25,65,.28),transparent 55%);
  pointer-events:none;
}
.hero .in{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  column-gap:46px;
  align-items:center;
  max-width:1000px;
}
.hero .in>*{grid-column:1}
.hero .brand{margin:0 0 24px;gap:14px}
.hero .brand img{width:66px;height:66px;border:2px solid rgba(255,255,255,.72);box-shadow:0 5px 20px rgba(0,0,0,.22)}
.hero .brand strong{color:#fff}
.hero .brand span{color:#cfe8ff}
.hero h1{font-size:clamp(54px,8vw,88px);letter-spacing:-1px;text-shadow:0 4px 18px rgba(0,0,0,.18)}
.hero .lead{color:#d9edff;margin:12px 0 20px}
.hero .meta{color:#d7eaff;margin-bottom:26px}
.hero .meta b{color:#fff}
.hero .btn{
  background:linear-gradient(135deg,#9cddff 0%,#55b5f5 52%,#328ee8 100%);
  color:#062653;
  border:1px solid rgba(224,245,255,.72);
  box-shadow:0 8px 22px rgba(2,25,64,.28),inset 0 1px 0 rgba(255,255,255,.35);
}
.hero .btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.hero .in>.me{
  grid-column:2;
  grid-row:1 / span 6;
  align-self:center;
  position:relative;
  width:clamp(190px,25vw,270px);
  aspect-ratio:1;
  margin:20px 12px 20px 0;
}
.me img{
  border-radius:50%;
  border:5px solid #9bd8ff;
  box-shadow:0 12px 36px rgba(25,2,14,.42),0 0 0 1px rgba(255,255,255,.25);
  object-position:50% 14%;
}
.me::before{inset:-18px;border:2px dashed rgba(190,229,255,.82)}
.me::after{color:#bfe6ff}
